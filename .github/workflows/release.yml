name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build AppImage + deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hina ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Linux builds for this tag.

            **AppImage**
            ```bash
            chmod +x Hina_*_amd64.AppImage
            ./Hina_*_amd64.AppImage
            ```

            **Debian / Ubuntu**
            ```bash
            sudo dpkg -i Hina_*_amd64.deb
            ```

            Requires [Pi](https://github.com/earendil-works/pi) on `PATH` (or `PI_BIN`) and
            WebKitGTK 4.1 + GTK 3.
          releaseDraft: false
          prerelease: false
          args: --bundles appimage,deb

  checks:
    name: cargo check + svelte-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm run build
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
